<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Tutor - Acompanhamento Escolar</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .btn-primary { background-color: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: #6b7280; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; }
        .btn-secondary:hover { background-color: #4b5563; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #2563eb; }
    </style>
</head>
<body class="font-sans antialiased">

<div id="app" class="max-w-6xl mx-auto p-4">
    <!-- Tela de login -->
    <div id="loginScreen" class="bg-white rounded-2xl shadow-xl p-8 max-w-md mx-auto mt-20">
        <h2 class="text-2xl font-bold mb-6 text-center">Acesso Professor</h2>
        <div id="loginError" class="text-red-500 text-sm mb-3 hidden"></div>
        <input type="email" id="loginEmail" placeholder="E-mail" class="w-full p-2 border rounded mb-3">
        <input type="password" id="loginPassword" placeholder="Senha" class="w-full p-2 border rounded mb-4">
        <button id="loginBtn" class="btn-primary w-full">Entrar</button>
        <p class="text-center mt-4 text-sm text-gray-600">Não tem conta? <a href="#" id="showRegister" class="text-blue-600">Registrar</a></p>
    </div>

    <!-- Tela de registro -->
    <div id="registerScreen" class="bg-white rounded-2xl shadow-xl p-8 max-w-md mx-auto mt-20 hidden">
        <h2 class="text-2xl font-bold mb-6 text-center">Registro Professor</h2>
        <div id="registerError" class="text-red-500 text-sm mb-3 hidden"></div>
        <input type="email" id="regEmail" placeholder="E-mail" class="w-full p-2 border rounded mb-3">
        <input type="password" id="regPassword" placeholder="Senha" class="w-full p-2 border rounded mb-3">
        <input type="text" id="regNome" placeholder="Nome completo" class="w-full p-2 border rounded mb-4">
        <button id="registerBtn" class="btn-primary w-full">Registrar</button>
        <p class="text-center mt-4 text-sm text-gray-600">Já tem conta? <a href="#" id="showLogin" class="text-blue-600">Entrar</a></p>
    </div>

    <!-- Dashboard principal -->
    <div id="dashboardScreen" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">📚 Minhas Turmas</h1>
            <div><span id="userName" class="mr-4 font-semibold"></span><button id="logoutBtn" class="btn-secondary">Sair</button></div>
        </div>
        <button id="novaTurmaBtn" class="btn-primary mb-4">+ Nova Turma</button>
        <div id="turmasList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Tela da turma -->
    <div id="turmaScreen" class="hidden">
        <div class="flex items-center gap-4 mb-6">
            <button id="backToDashboardBtn" class="btn-secondary">⬅ Voltar</button>
            <h2 id="turmaNome" class="text-2xl font-bold"></h2>
        </div>
        <div class="border-b mb-4 flex gap-4">
            <button class="tab-btn active pb-2" data-tab="alunos">👥 Alunos</button>
            <button class="tab-btn pb-2" data-tab="avaliacoes">📊 Avaliações</button>
            <button class="tab-btn pb-2" data-tab="graficos">📈 Gráficos</button>
        </div>
        <!-- Alunos -->
        <div id="tabAlunos"><button id="novoAlunoBtn" class="btn-primary mb-3 text-sm">+ Adicionar Aluno</button><div id="alunosList"></div></div>
        <!-- Avaliações -->
        <div id="tabAvaliacoes" class="hidden">
            <div class="mb-3 flex gap-2 flex-wrap"><select id="filtroAluno" class="border p-2 rounded w-64"></select><select id="filtroMes" class="border p-2 rounded w-40"><option value="MARÇO">Março</option><option value="ABRIL">Abril</option><option value="MAIO">Maio</option><option value="JUNHO">Junho</option><option value="JULHO">Julho</option><option value="AGOSTO">Agosto</option><option value="SETEMBRO">Setembro</option><option value="OUTUBRO">Outubro</option><option value="NOVEMBRO">Novembro</option><option value="DEZEMBRO">Dezembro</option></select><button id="novaAvaliacaoBtn" class="btn-primary text-sm">+ Nova</button></div>
            <div id="avaliacoesList" class="space-y-2"></div>
        </div>
        <!-- Gráficos -->
        <div id="tabGraficos" class="hidden"><canvas id="niveisChart" width="400" height="200"></canvas></div>
    </div>
</div>

<script>
    // 🔥 SUBSTITUA PELAS SUAS CONFIGURAÇÕES DO FIREBASE 🔥
    const firebaseConfig = {
  apiKey: "AIzaSyCfecWiewXDo3TZmGBhMSB9L6CYjQNmIiQ",
  authDomain: "registrotutorurecai.firebaseapp.com",
  projectId: "registrotutorurecai",
  storageBucket: "registrotutorurecai.firebasestorage.app",
  messagingSenderId: "653180444480",
  appId: "1:653180444480:web:af36fed97ca82470e8e4a5"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentTurmaId = null, currentUser = null, grafico = null;

    function showScreen(name) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('registerScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('turmaScreen').classList.add('hidden');
        document.getElementById(name + 'Screen').classList.remove('hidden');
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('userName').innerText = user.email;
            await carregarTurmas();
            showScreen('dashboard');
        } else { showScreen('login'); }
    });

    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value, pass = document.getElementById('loginPassword').value;
        try { await auth.signInWithEmailAndPassword(email, pass); } 
        catch (err) { document.getElementById('loginError').innerText = err.message; document.getElementById('loginError').classList.remove('hidden'); }
    };
    document.getElementById('registerBtn').onclick = async () => {
        const email = document.getElementById('regEmail').value, pass = document.getElementById('regPassword').value, nome = document.getElementById('regNome').value;
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection('usuarios').doc(cred.user.uid).set({ nome, email, role: 'professor' });
            alert('Cadastro realizado! Faça login.');
            showScreen('login');
        } catch (err) { document.getElementById('registerError').innerText = err.message; document.getElementById('registerError').classList.remove('hidden'); }
    };
    document.getElementById('showRegister').onclick = () => showScreen('register');
    document.getElementById('showLogin').onclick = () => showScreen('login');
    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    async function carregarTurmas() {
        const snap = await db.collection('turmas').where('professorId', '==', currentUser.uid).get();
        const container = document.getElementById('turmasList');
        container.innerHTML = '';
        if (snap.empty) { container.innerHTML = '<p class="text-gray-500">Nenhuma turma. Clique em "+ Nova Turma".</p>'; return; }
        snap.forEach(doc => {
            const d = doc.data();
            const div = document.createElement('div');
            div.className = 'card bg-white p-4 rounded-xl shadow cursor-pointer';
            div.innerHTML = `<h3 class="font-bold">${d.nome}</h3><p class="text-gray-600">${d.disciplina} · ${d.escola}</p>`;
            div.onclick = () => abrirTurma(doc.id, d);
            container.appendChild(div);
        });
    }

    async function abrirTurma(id, data) {
        currentTurmaId = id;
        document.getElementById('turmaNome').innerText = data.nome;
        await carregarAlunos(); await carregarAlunosSelect();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('.tab-btn').classList.add('active');
        document.getElementById('tabAlunos').classList.remove('hidden');
        document.getElementById('tabAvaliacoes').classList.add('hidden');
        document.getElementById('tabGraficos').classList.add('hidden');
        showScreen('turma');
    }

    async function carregarAlunos() {
        const snap = await db.collection('alunos').where('turmaId', '==', currentTurmaId).get();
        const container = document.getElementById('alunosList');
        container.innerHTML = '';
        if (snap.empty) { container.innerHTML = '<p class="text-gray-500">Nenhum aluno.</p>'; return; }
        snap.forEach(doc => {
            const a = doc.data();
            const div = document.createElement('div');
            div.className = 'bg-white p-3 rounded shadow flex justify-between items-center';
            div.innerHTML = `<span>${a.nome}</span><button class="text-red-500 text-sm" data-id="${doc.id}">Excluir</button>`;
            div.querySelector('button').onclick = async () => {
                if (confirm('Excluir aluno e avaliações?')) {
                    const avals = await db.collection('avaliacoes').where('alunoId', '==', doc.id).get();
                    avals.forEach(a => a.ref.delete());
                    await db.collection('alunos').doc(doc.id).delete();
                    carregarAlunos(); carregarAlunosSelect();
                }
            };
            container.appendChild(div);
        });
    }

    async function carregarAlunosSelect() {
        const snap = await db.collection('alunos').where('turmaId', '==', currentTurmaId).get();
        const sel = document.getElementById('filtroAluno');
        sel.innerHTML = '<option value="">Selecione um aluno</option>';
        snap.forEach(doc => sel.innerHTML += `<option value="${doc.id}">${doc.data().nome}</option>`);
    }

    document.getElementById('novaTurmaBtn').onclick = async () => {
        const nome = prompt('Nome da turma');
        if (!nome) return;
        const disciplina = prompt('Disciplina (MATEMÁTICA ou LINGUA PORTUGUESA)');
        const escola = prompt('Escola');
        const turno = prompt('Turno (manhã/tarde)') || 'manhã';
        await db.collection('turmas').add({ nome, disciplina, escola, turno, professorId: currentUser.uid });
        carregarTurmas();
    };
    document.getElementById('novoAlunoBtn').onclick = async () => {
        const nome = prompt('Nome do aluno');
        if (!nome) return;
        await db.collection('alunos').add({ nome, turmaId: currentTurmaId });
        carregarAlunos(); carregarAlunosSelect();
    };
    document.getElementById('novaAvaliacaoBtn').onclick = async () => {
        const alunoId = document.getElementById('filtroAluno').value;
        const mes = document.getElementById('filtroMes').value;
        if (!alunoId) { alert('Selecione um aluno'); return; }
        const volume = prompt('Volume (ex: Vol1: Aquisição)');
        const modulo = parseInt(prompt('Módulo (1-4)'));
        const cena = prompt('Cena (VM/AM/VR)').toUpperCase();
        if (!volume || !modulo || !cena) return;
        await db.collection('avaliacoes').add({ alunoId, mes, volume, modulo, cena, dataRegistro: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('filtroAluno').dispatchEvent(new Event('change'));
        atualizarGraficos();
    };
    document.getElementById('filtroAluno').addEventListener('change', async () => {
        const alunoId = document.getElementById('filtroAluno').value;
        const mes = document.getElementById('filtroMes').value;
        if (!alunoId) return;
        const snap = await db.collection('avaliacoes').where('alunoId', '==', alunoId).where('mes', '==', mes).get();
        const container = document.getElementById('avaliacoesList');
        container.innerHTML = '';
        if (snap.empty) { container.innerHTML = '<p class="text-gray-500">Nenhuma avaliação.</p>'; return; }
        snap.forEach(doc => {
            const a = doc.data();
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-3 rounded flex justify-between';
            div.innerHTML = `<div><strong>Módulo ${a.modulo}</strong> · ${a.volume} · ${a.cena}</div><button class="text-red-500 text-sm" data-id="${doc.id}">Excluir</button>`;
            div.querySelector('button').onclick = async () => { await db.collection('avaliacoes').doc(doc.id).delete(); document.getElementById('filtroAluno').dispatchEvent(new Event('change')); atualizarGraficos(); };
            container.appendChild(div);
        });
    });
    document.getElementById('filtroMes').addEventListener('change', () => document.getElementById('filtroAluno').dispatchEvent(new Event('change')));

    async function atualizarGraficos() {
        const alunosSnap = await db.collection('alunos').where('turmaId', '==', currentTurmaId).get();
        let niveis = { VM:0, AM:0, VR:0 };
        for (let doc of alunosSnap.docs) {
            const avals = await db.collection('avaliacoes').where('alunoId', '==', doc.id).get();
            avals.forEach(av => { if (niveis[av.data().cena] !== undefined) niveis[av.data().cena]++; });
        }
        const ctx = document.getElementById('niveisChart').getContext('2d');
        if (grafico) grafico.destroy();
        grafico = new Chart(ctx, {
            type: 'bar', data: { labels: ['VM (Inicial)', 'AM (Intermediário)', 'VR (Esperado)'], datasets: [{ label: 'Quantidade', data: [niveis.VM, niveis.AM, niveis.VR], backgroundColor: ['#ef4444','#eab308','#22c55e'] }] }
        });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tab = btn.getAttribute('data-tab');
            document.getElementById('tabAlunos').classList.add('hidden');
            document.getElementById('tabAvaliacoes').classList.add('hidden');
            document.getElementById('tabGraficos').classList.add('hidden');
            if (tab === 'alunos') document.getElementById('tabAlunos').classList.remove('hidden');
            if (tab === 'avaliacoes') { document.getElementById('tabAvaliacoes').classList.remove('hidden'); document.getElementById('filtroAluno').dispatchEvent(new Event('change')); }
            if (tab === 'graficos') { document.getElementById('tabGraficos').classList.remove('hidden'); atualizarGraficos(); }
        });
    });
    document.getElementById('backToDashboardBtn').onclick = () => { showScreen('dashboard'); carregarTurmas(); };
</script>
</body>
</html>
